[project]
name = "f1-deltaline"
version = "0.1.0"
description = "Compare F1 drivers' laps and see where on track each one was faster"
requires-python = ">=3.12"
dependencies = [
    "fastf1>=3.8.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pyside6-essentials>=6.11.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
